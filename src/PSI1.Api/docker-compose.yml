services:
  psi1-db:
    image: postgres:15-alpine
    container_name: psi1-postgres
    environment:
      POSTGRES_DB: psi1
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - psi1_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgweb:
    image: sosedoff/pgweb
    container_name: psi1-pgweb
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://postgres@psi1-db:5432/psi1?sslmode=disable
    depends_on:
      - psi1-db
    restart: unless-stopped

volumes:
  psi1_postgres_data:
